<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Adivinar el Color</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #f8f9fa;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .stats-item span {
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        .color-box {
            width: 100%;
            height: 150px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
            border: 3px solid #ffffff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            text-transform: capitalize;
        }

        .btn-option:hover:not([disabled]) {
            border-color: var(--accent-color);
            background-color: #f0f7ff;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background-color: var(--success-color) !important;
            color: white !important;
            border-color: var(--success-color) !important;
        }

        .btn-option.wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
        }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn-action:hover {
            background-color: #2c3e50;
        }

        .results-box {
            display: none;
            padding: 10px 0;
        }

        .results-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--success-color);
            margin: 15px 0;
        }

        .summary-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Adivina el Color 🎨</h1>
        <p class="subtitle">Selecciona el nombre correcto del color</p>

        <!-- Pantalla del Juego -->
        <div id="game-screen">
            <div class="stats-bar">
                <div class="stats-item">Pregunta: <span id="current-question-num">1</span>/10</div>
                <div class="stats-item">Aciertos: <span id="score">0</span></div>
            </div>

            <!-- Recuadro del color -->
            <div class="color-box" id="color-display"></div>

            <!-- Opciones de respuesta -->
            <div class="options-grid" id="options-container">
                <!-- Botones generados por JS -->
            </div>

            <button class="btn-action" id="next-btn" style="display: none;" onclick="nextQuestion()">Siguiente Pregunta ➔</button>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="results-screen" class="results-box">
            <div class="results-title">¡Juego Terminado! 🎉</div>
            <p>Has completado los 10 ejercicios de colores.</p>
            <div class="final-score" id="final-score-text">0 / 10</div>
            <p class="summary-text" id="feedback-message">¡Buen trabajo!</p>
            <button class="btn-action" onclick="restartGame()">Jugar de Nuevo 🔄</button>
        </div>
    </div>

    <script>
        // Banco de colores con su nombre en español y código HEX
        const COLOR_DATABASE = [
            { name: "Rojo", hex: "#E74C3C" },
            { name: "Azul", hex: "#3498DB" },
            { name: "Verde", hex: "#2ECC71" },
            { name: "Amarillo", hex: "#F1C40F" },
            { name: "Naranja", hex: "#E67E22" },
            { name: "Morado", hex: "#9B59B6" },
            { name: "Rosado", hex: "#FD79A8" },
            { name: "Cian", hex: "#00CEC9" },
            { name: "Gris", hex: "#95A5A6" },
            { name: "Marrón", hex: "#8D6E63" },
            { name: "Negro", hex: "#2D3436" },
            { name: "Verde Lima", hex: "#00B894" },
            { name: "Violeta", hex: "#6C5CE7" },
            { name: "Turquesa", hex: "#1ABC9C" }
        ];

        const MAX_QUESTIONS = 10;
        let currentQuestion = 0;
        let score = 0;
        let currentColor = null;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            currentQuestion++;
            document.getElementById('current-question-num').textContent = currentQuestion;
            document.getElementById('next-btn').style.display = 'none';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Seleccionar un color correcto aleatorio del banco
            const colorIndex = getRandomInt(0, COLOR_DATABASE.length - 1);
            currentColor = COLOR_DATABASE[colorIndex];

            // Mostrar el color en la caja central
            document.getElementById('color-display').style.backgroundColor = currentColor.hex;

            // Generar 3 opciones incorrectas sin repetir
            const options = new Set();
            options.add(currentColor);

            while (options.size < 4) {
                const randomOption = COLOR_DATABASE[getRandomInt(0, COLOR_DATABASE.length - 1)];
                options.add(randomOption);
            }

            // Mezclar opciones
            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            // Crear los 4 botones
            shuffledOptions.forEach(colorObj => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.textContent = colorObj.name;
                btn.onclick = () => checkAnswer(btn, colorObj);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedColor) {
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedColor.name === currentColor.name) {
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score').textContent = score;
            } else {
                selectedBtn.classList.add('wrong');
                // Revelar la respuesta correcta
                buttons.forEach(btn => {
                    if (btn.textContent === currentColor.name) {
                        btn.classList.add('correct');
                    }
                });
            }

            const nextBtn = document.getElementById('next-btn');
            if (currentQuestion < MAX_QUESTIONS) {
                nextBtn.textContent = "Siguiente Pregunta ➔";
            } else {
                nextBtn.textContent = "Ver Resultados 📊";
            }
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            if (currentQuestion < MAX_QUESTIONS) {
                generateQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';

            document.getElementById('final-score-text').textContent = `${score} / 10`;

            const feedback = document.getElementById('feedback-message');
            if (score === 10) {
                feedback.textContent = "¡Perfecto! Tienes una excelente visión para los colores. 🎨🏆";
            } else if (score >= 7) {
                feedback.textContent = "¡Excelente trabajo! Conoces muy bien los colores. 👍";
            } else if (score >= 5) {
                feedback.textContent = "¡Buen intento! Sigue practicando. 💪";
            } else {
                feedback.textContent = "¡No te preocupes! Vuelve a intentarlo para mejorar. 📚";
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            generateQuestion();
        }

        document.addEventListener('DOMContentLoaded', generateQuestion);
    </script>
</body>
</html>
